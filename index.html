<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPSLAB CREATORS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0d17;
      color: #e0e6ed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Sol üst köşe başlığı */
    header {
      padding: 20px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #00d2ff;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    /* Ekranın ortasındaki kutu */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #161b22;
      border: 1px solid #00d2ff;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
      border-radius: 12px;
      padding: 40px;
      max-width: 650px;
      text-align: center;
      line-height: 1.6;
      font-size: 1.1rem;
    }

    .card a {
      color: #00d2ff;
      text-decoration: none;
      word-break: break-all;
      font-weight: 600;
    }

    .card a:hover {
      text-decoration: underline;
      color: #38ef7d;
    }
  </style>
</head>
<body>

  <header>
    FPSLAB CREATORS⚡️
  </header>

  <main>
    <div class="card">
      Merhaba ben <a href="https://sdfsgedsfhstjhfghfda.github.io/fps-lab/" target="_blank">https://sdfsgedsfhstjhfghfda.github.io/fps-lab/</a> geliştiricilerinden biriyim gerekli işlemci ve oyun bilgilerini veriyorum biz bu site için çok fazla çalışıyoruz lütfen destek verin
    </div>
  </main>

</body>
</html>
